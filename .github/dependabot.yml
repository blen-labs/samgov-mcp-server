version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      mcp-sdk:
        {
          patterns:
            [
              '@modelcontextprotocol/server',
              '@modelcontextprotocol/node',
              '@modelcontextprotocol/client',
            ],
        }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
